name: Build and start check

on:
  push:
    branches:
      - main
      - fix/build-start-ci
  pull_request:
  workflow_dispatch:

jobs:
  build-and-start:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and refresh lockfile if needed
        run: bun install

      - name: Build
        run: bun run build

      - name: Start production server and smoke test
        shell: bash
        run: |
          set -euo pipefail
          bun run start > /tmp/next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/ -o /tmp/homepage.html; then
              echo "Production server responded successfully."
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/next-start.log
              exit 1
            fi
            sleep 2
          done

          cat /tmp/next-start.log
          echo "Production server did not become ready in time."
          exit 1
